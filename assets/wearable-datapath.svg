<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="428" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title -->
  <text x="30" y="40" fill="#8b949e" font-size="13" letter-spacing="2">WEARABLE HEALTH MONITORING SYSTEM · STM32 → ESP32</text>
  <text x="30" y="60" fill="#484f58" font-size="11">msc project · university of leeds · multi-sensor vital-sign monitor with wi-fi streaming</text>

  <!-- sensor column -->
  <text x="100" y="88" fill="#ff7b72" font-size="10" text-anchor="middle" letter-spacing="2">SENSORS</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="98"  width="140" height="38" rx="6" fill="#1a0f14" stroke="#f85149" stroke-width="1.3"/>
    <polyline points="40,121 52,121 56,114 60,128 64,108 68,132 72,121 80,121" fill="none" stroke="#f85149" stroke-width="1.3" filter="url(#glow)"/>
    <text x="125" y="115" fill="#ff7b72">HR · SpO2</text>
    <text x="125" y="128" fill="#6e7681" font-size="8">pulse oximeter</text>

    <rect x="30" y="144" width="140" height="38" rx="6" fill="#1a0f14" stroke="#f85149" stroke-width="1.3"/>
    <polyline points="40,167 50,167 53,165 56,170 59,150 62,175 65,167 80,167" fill="none" stroke="#f85149" stroke-width="1.3" filter="url(#glow)"/>
    <text x="125" y="161" fill="#ff7b72">ECG</text>
    <text x="125" y="174" fill="#6e7681" font-size="8">cardiac signal</text>

    <rect x="30" y="190" width="140" height="38" rx="6" fill="#1a0f14" stroke="#f85149" stroke-width="1.3"/>
    <rect x="55" y="198" width="8" height="20" rx="4" fill="none" stroke="#ffa657" stroke-width="1.3"/>
    <circle cx="59" cy="220" r="5" fill="#ffa657"/>
    <text x="125" y="207" fill="#ff7b72">TEMP</text>
    <text x="125" y="220" fill="#6e7681" font-size="8">body temperature</text>

    <rect x="30" y="236" width="140" height="38" rx="6" fill="#1a0f14" stroke="#f85149" stroke-width="1.3"/>
    <g stroke="#ffa657" stroke-width="1.3" fill="none">
      <line x1="59" y1="263" x2="59" y2="245"/><line x1="59" y1="263" x2="75" y2="263"/><line x1="59" y1="263" x2="48" y2="270"/>
    </g>
    <text x="125" y="253" fill="#ff7b72">IMU</text>
    <text x="125" y="266" fill="#6e7681" font-size="8">accel · motion</text>

    <rect x="30" y="282" width="140" height="38" rx="6" fill="#1a0f14" stroke="#f85149" stroke-width="1.3"/>
    <path d="M42 305 q6 -12 12 0 t12 0 t12 0" fill="none" stroke="#ffa657" stroke-width="1.3"/>
    <text x="125" y="299" fill="#ff7b72">GSR</text>
    <text x="125" y="312" fill="#6e7681" font-size="8">skin conductance</text>
  </g>

  <!-- sensor bus -->
  <g stroke="#3a4250" stroke-width="1.5" fill="none">
    <line x1="170" y1="117" x2="195" y2="117"/>
    <line x1="170" y1="163" x2="195" y2="163"/>
    <line x1="170" y1="209" x2="195" y2="209"/>
    <line x1="170" y1="255" x2="195" y2="255"/>
    <line x1="170" y1="301" x2="195" y2="301"/>
    <line x1="195" y1="117" x2="195" y2="301"/>
    <line x1="195" y1="209" x2="225" y2="209"/>
  </g>
  <circle r="3.5" fill="#7ee787" filter="url(#glow)">
    <animate attributeName="cy" values="117;209" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="195;195" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#7ee787" filter="url(#glow)">
    <animate attributeName="cy" values="301;209" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="195;195" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="209" r="3.5" fill="#7ee787" filter="url(#glow)"/>

  <!-- MCU region -->
  <rect x="225" y="98" width="520" height="222" rx="10" fill="#140f1f" stroke="#d2a8ff" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="485" y="122" fill="#d2a8ff" font-size="11" text-anchor="middle" letter-spacing="2">MCU FIRMWARE · EMBEDDED C</text>

  <g stroke="#3a4250" stroke-width="1.5">
    <line x1="363" y1="209" x2="388" y2="209"/>
    <line x1="526" y1="209" x2="551" y2="209"/>
    <line x1="745" y1="209" x2="790" y2="209"/>
    <line x1="890" y1="209" x2="900" y2="209"/>
  </g>
  <circle cx="375" cy="209" r="3.5" fill="#7ee787" filter="url(#glow)"/>
  <circle cx="538" cy="209" r="3.5" fill="#7ee787" filter="url(#glow)"/>

  <rect x="243" y="179" width="120" height="60" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="303" y="204" fill="#e6edf3" font-size="12" text-anchor="middle">acquisition</text>
  <text x="303" y="222" fill="#6e7681" font-size="9" text-anchor="middle">multi-sensor sampling</text>

  <rect x="388" y="179" width="138" height="60" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="457" y="204" fill="#e6edf3" font-size="12" text-anchor="middle">filtering</text>
  <text x="457" y="222" fill="#6e7681" font-size="9" text-anchor="middle">motion-noise reduction</text>

  <rect x="551" y="179" width="175" height="60" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="638" y="204" fill="#e6edf3" font-size="12" text-anchor="middle">vital-sign extraction</text>
  <text x="638" y="222" fill="#6e7681" font-size="9" text-anchor="middle">HR · SpO2 · ECG · temp · GSR</text>

  <text x="485" y="292" fill="#6e7681" font-size="9" text-anchor="middle">prototyped on STM32 · migrated to ESP32</text>

  <!-- wifi -->
  <circle r="4" fill="#7ee787" filter="url(#glow)">
    <animate attributeName="cx" values="745;790" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="209;209" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="790" y="174" width="100" height="70" rx="8" fill="#1c1708" stroke="#e3b341" stroke-width="1.5"/>
  <text x="840" y="202" fill="#e3b341" font-size="13" text-anchor="middle" font-weight="bold">Wi-Fi</text>
  <text x="840" y="220" fill="#6e7681" font-size="9" text-anchor="middle">ESP32 built-in</text>
  <text x="840" y="233" fill="#6e7681" font-size="9" text-anchor="middle">live streaming</text>

  <!-- host -->
  <rect x="900" y="169" width="80" height="80" rx="8" fill="#0b1724" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="900" cy="209" r="4" fill="#7ee787" filter="url(#glow)"/>
  <text x="940" y="202" fill="#79c0ff" font-size="12" text-anchor="middle" font-weight="bold">HOST</text>
  <text x="940" y="219" fill="#6e7681" font-size="9" text-anchor="middle">live vitals</text>
  <text x="940" y="232" fill="#6e7681" font-size="9" text-anchor="middle">view</text>

  <!-- footer spec sheet -->
  <line x1="30" y1="350" x2="970" y2="350" stroke="#21262d"/>
  <g font-size="11">
    <text x="30" y="376" fill="#484f58">prototype</text>   <text x="125" y="376" fill="#c9d1d9">STM32</text>
    <text x="30" y="400" fill="#484f58">final MCU</text>   <text x="125" y="400" fill="#c9d1d9">ESP32</text>

    <text x="300" y="376" fill="#484f58">sensors</text>     <text x="395" y="376" fill="#c9d1d9">5 · HR/SpO2 · ECG · temp · IMU · GSR</text>
    <text x="300" y="400" fill="#484f58">challenge</text>   <text x="395" y="400" fill="#c9d1d9">motion-noise in HR signal</text>

    <text x="740" y="376" fill="#484f58">domain</text>      <text x="840" y="376" fill="#7ee787">biomedical</text>
    <text x="740" y="400" fill="#484f58">connectivity</text><text x="840" y="400" fill="#7ee787">Wi-Fi</text>
  </g>
</svg>
